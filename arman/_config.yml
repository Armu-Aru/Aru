title: Aru's Page
email: armansingh.jaryal@niser.ac.in
author: arman-jaryal

lang: de
description: >-
  Arman Singh Jaryal's homepage.

baseurl: "/Aru"
url: "https://armu-aru.github.io"
favicon: "/Aru/flavicon.png"

locale: de_DE
yat:
  date_format: "%b %d, %Y"

night_mode: "on"

orangered: #ff5100
greatgold: #f2cb05
greenblue: #389092
sriniblue: #348feb

brand_color: "#6495ed"

header_pages:
  - index.html
  - about.html
  - gallery.md
  - portfolio.md
  - contact.md

defaults:
  home:
    heading: ""
    subheading: ""
    banner: "/assets/post/homepage.jpg"

markdown: kramdown
kramdown:
  input: GFM

theme: jekyll-theme-yat

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-spaceship
